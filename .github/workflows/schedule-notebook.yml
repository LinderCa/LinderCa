name: Run Python Notebook

on:
  schedule:
    # Programación diaria a las 12:00 UTC
    - cron: "0 12 * * *"

  workflow_dispatch: # Permite ejecutar manualmente el workflow
    inputs:
      custom_param:
        description: 'Parametro opcional'
        required: false

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run notebook
      run: |
        pip install nbconvert papermill
        papermill tu_notebook.ipynb salida_notebook.ipynb
